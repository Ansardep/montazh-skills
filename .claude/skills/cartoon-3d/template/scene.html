<!doctype html><html><head><meta charset="utf-8"><title>loading</title>
<style>
@font-face { font-family: Mont; src: url(a/Montserrat-700.ttf); font-weight: 700; }
body { margin: 0; background: #000; overflow: hidden; }
canvas { display: block; }
/* СУБТИТРЫ — стиль здесь */
#sub { position: absolute; left: 40px; right: 40px; top: 74%; text-align: center; font: 700 34px/1.3 Mont, sans-serif; color: #fff;
  text-shadow: 0 2px 8px rgba(0,0,0,.7), 0 0 2px rgba(0,0,0,.8); }
#sub b { display: block; font-size: 20px; letter-spacing: .12em; opacity: .75; margin-bottom: 4px; }
</style></head><body>
<div id="sub"></div>
<script src="node_modules/three/build/three.min.js"></script>
<script>
// CAST (кто в кадре и где) подставляет render.mjs из script.json. Для просмотра в браузере — значения по умолчанию.
window.CAST = window.CAST || { mode: 'night', heroes: [{ id: 'heroine', type: 'heroine' }, { id: 'cloudy', type: 'cloudy' }] };
const W = innerWidth || 720, H = innerHeight || 1280;
const R = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
R.setSize(W, H); R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap;
R.outputColorSpace = THREE.SRGBColorSpace; R.toneMapping = THREE.ACESFilmicToneMapping; R.toneMappingExposure = 1.05;
document.body.prepend(R.domElement);
const S = new THREE.Scene(); S.background = new THREE.Color('#2b2a33');
const cam = new THREE.PerspectiveCamera(36, W / H, 0.1, 100);

// ---------- помощники для героев и комнаты ----------
function rnd(seed) { let s = seed; return () => { s = (s * 16807) % 2147483647; return s / 2147483647 } }
function lowpoly(geo, amt, seed) {
  const r = rnd(seed || 7), p = geo.attributes.position, map = {};
  for (let i = 0; i < p.count; i++) {
    const k = p.getX(i).toFixed(3) + ',' + p.getY(i).toFixed(3) + ',' + p.getZ(i).toFixed(3);
    if (!map[k]) map[k] = [(r() - .5) * amt, (r() - .5) * amt, (r() - .5) * amt]; const o = map[k]; p.setXYZ(i, p.getX(i) + o[0], p.getY(i) + o[1], p.getZ(i) + o[2]);
  }
  geo.computeVertexNormals(); return geo;
}
const M = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: c, flatShading: true, roughness: .85, metalness: 0 }, o));
function add(geo, mat, x, y, z, parent) { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; (parent || S).add(m); return m }
function canvasTex(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t }
const HEROES = {};
</script>
<script src="heroes.js"></script>
<script>
// ---------- КОМНАТА (гостиная: окно с городом, диван, столик, ковёр, растение, торшер) ----------
const floorTex = canvasTex(1024, 1024, (g, w, h) => { for (let i = 0; i < 8; i++) { g.fillStyle = ['#b98a5f', '#c4966a', '#ad7f55', '#bf9064'][i % 4]; g.fillRect(0, i * h / 8, w, h / 8); g.fillStyle = '#8a603d'; g.fillRect(0, i * h / 8, w, 4); g.fillRect((i * 317) % w, i * h / 8, 4, h / 8) } });
floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping; floorTex.repeat.set(2, 2);
const floor = add(new THREE.PlaneGeometry(30, 30), new THREE.MeshStandardMaterial({ map: floorTex, roughness: .7 }), 0, 0, 0); floor.rotation.x = -Math.PI / 2; floor.castShadow = false;
const wallM = M('#8a8f99', { flatShading: false });
add(new THREE.BoxGeometry(30, 14, .3), wallM, 0, 7, -5); add(new THREE.BoxGeometry(.3, 14, 30), wallM, -7, 7, 0); add(new THREE.BoxGeometry(30, .3, .4), M('#d8d4cc'), 0, .15, -4.8);
const night = CAST.mode !== 'day';
const city = canvasTex(512, 640, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h), r = rnd(night ? 5 : 3);
  if (night) { gr.addColorStop(0, '#07081c'); gr.addColorStop(.7, '#1a1840'); gr.addColorStop(1, '#3a2a5a') } else { gr.addColorStop(0, '#2c2a5e'); gr.addColorStop(.55, '#5a4a8a'); gr.addColorStop(.8, '#c9758a') }
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  if (night) { for (let i = 0; i < 40; i++) { g.fillStyle = 'rgba(255,255,255,' + (.3 + r() * .6) + ')'; g.fillRect(r() * w, r() * h * .45, 2, 2) } g.fillStyle = '#f3efd8'; g.beginPath(); g.arc(w * .78, h * .16, 26, 0, 7); g.fill() }
  for (let b = 0; b < 9; b++) { const bx = b * 60 - 10, bh = 200 + r() * 260; g.fillStyle = night ? '#090914' : '#14142a'; g.fillRect(bx, h - bh, 56, bh); for (let y = h - bh + 14; y < h - 10; y += 26) for (let x = bx + 8; x < bx + 50; x += 16) if (r() > (night ? .4 : .45)) { g.fillStyle = r() > .3 ? '#ffc96b' : '#ffe9a8'; g.fillRect(x, y, 8, 12) } }
});
add(new THREE.PlaneGeometry(3.6, 4.4), new THREE.MeshBasicMaterial({ map: city }), -1.6, 4.4, -4.83).castShadow = false;
const fr = M('#e9e6df'); for (const [w, h, x, y] of [[3.8, .18, -1.6, 6.6], [3.8, .18, -1.6, 2.2], [.18, 4.6, -3.5, 4.4], [.18, 4.6, .3, 4.4], [.12, 4.4, -1.6, 4.4], [3.6, .12, -1.6, 4.6]]) add(new THREE.BoxGeometry(w, h, .2), fr, x, y, -4.75);
const curtM = M('#e08a2e'); for (const cx of [-4.0, 0.8]) for (let i = 0; i < 5; i++) add(new THREE.BoxGeometry(.28, 6.8, .25), curtM, cx + i * .22, 3.6, -4.5 + (i % 2) * .12);
add(new THREE.CylinderGeometry(.05, .05, 6, 6), M('#3a3a3a'), -1.6, 7.05, -4.55).rotation.z = Math.PI / 2;
const sofM = M('#d9a441'); add(new THREE.BoxGeometry(5, .9, 1.6), sofM, 2.6, .75, -3.9); add(new THREE.BoxGeometry(5, 1.6, .5), sofM, 2.6, 1.6, -4.55);
add(new THREE.BoxGeometry(.5, 1.3, 1.6), sofM, .2, 1.0, -3.9); add(new THREE.BoxGeometry(.5, 1.3, 1.6), sofM, 5.0, 1.0, -3.9);
add(new THREE.BoxGeometry(1.1, .9, .3), M('#f0ece2'), 1.4, 1.6, -4.1).rotation.z = .15;
add(new THREE.CylinderGeometry(.9, .9, .12, 10), M('#8a5a3a'), 3.4, 1.0, -2.2); add(new THREE.CylinderGeometry(.08, .08, .95, 6), M('#5a3a26'), 3.4, .5, -2.2);
[['#e8d6b0', 2.6], ['#3f7f9f', 2.2], ['#e8d6b0', 1.8], ['#d98a4a', 1.4], ['#e8d6b0', 1.0]].forEach(([c, r], i) => { add(new THREE.CylinderGeometry(r, r, .03, 40), M(c, { flatShading: false }), 2.2, .02 + i * .004, .6).castShadow = false });
add(new THREE.CylinderGeometry(.45, .35, .9, 8), M('#e7e2d8'), -5.6, .45, -3.6);
const leafM = M('#3f7d4a'), r0 = rnd(11); for (let i = 0; i < 9; i++) { const l = add(lowpoly(new THREE.ConeGeometry(.22, 1.8, 5), .04, i + 1), leafM, -5.6 + (r0() - .5) * .6, 1.6 + r0() * .6, -3.6 + (r0() - .5) * .6); l.rotation.set((r0() - .5) * 1.2, r0() * 3, (r0() - .5) * 1.2) }
add(new THREE.CylinderGeometry(.04, .04, 4.6, 6), M('#2b2b2b'), 5.9, 2.3, -3.2); add(new THREE.CylinderGeometry(.5, .5, .06, 10), M('#2b2b2b'), 5.9, .03, -3.2);
add(new THREE.CylinderGeometry(.45, .9, .9, 12, 1, true), new THREE.MeshStandardMaterial({ color: '#fff1cc', emissive: '#ffcf80', emissiveIntensity: .9, side: THREE.DoubleSide }), 5.9, 4.7, -3.2);

// ---------- СВЕТ (день / ночь) ----------
const hemi = new THREE.HemisphereLight('#c9d4ff', '#6a4a30', .75); S.add(hemi);
const lamp = new THREE.PointLight('#ffb866', 38, 18, 1.6); lamp.position.set(5.6, 4.4, -2.6); lamp.castShadow = true; lamp.shadow.mapSize.set(2048, 2048); lamp.shadow.radius = 6; S.add(lamp);
const key = new THREE.DirectionalLight('#fff0e0', 1.5); key.position.set(4, 9, 8); key.castShadow = true; key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8 }); key.shadow.radius = 4; S.add(key);
const fill = new THREE.DirectionalLight('#9fb4ff', .45); fill.position.set(-6, 4, 3); S.add(fill);
const front = new THREE.DirectionalLight('#fff4ea', .9); front.position.set(0, 4, 12); S.add(front);
if (night) {
  S.background = new THREE.Color('#0d0c16'); hemi.intensity = .32; hemi.color.set('#6a78c8'); hemi.groundColor.set('#2a1810');
  key.intensity = .35; key.color.set('#8fa4ff'); key.position.set(-5, 8, 4); fill.intensity = .25; front.intensity = .42; front.color.set('#ffd9b8'); lamp.intensity = 55;
}

// ---------- ГЕРОИ из CAST ----------
const cast = {};
CAST.heroes.forEach(h => {
  cast[h.id] = Object.assign(HEROES[h.type](h.place || {}), { id: h.id });
  if (night) { // тёплый свет на лицо каждому, чтобы в ночной комнате было видно эмоции
    const p = cast[h.id].close.l, L = new THREE.PointLight(h.light || '#ffc48a', h.lightPower || 8, 9, 1.8);
    L.position.set(p[0] - .4, p[1] + .8, p[2] + 2.9); S.add(L);
  }
});

// ---------- КАМЕРЫ: общий план + крупный план каждого героя ----------
const SHOTS = Object.assign({ wide: { p: [.1, 3.3, 11.2], l: [.1, 2.35, .4], fov: 36 } }, CAST.shots || {});
for (const id in cast) SHOTS[id] = SHOTS[id] || cast[id].close;

window.renderFrame = function (f) {
  const t = f.t, st = f.st, sh = SHOTS[f.shot] || SHOTS.wide, push = Math.min(st, 8) * 0.045;
  const dir = new THREE.Vector3(sh.l[0] - sh.p[0], sh.l[1] - sh.p[1], sh.l[2] - sh.p[2]).normalize();
  cam.fov = sh.fov; cam.updateProjectionMatrix();
  cam.position.set(sh.p[0] + dir.x * push + Math.sin(t * .5) * .05, sh.p[1] + dir.y * push + Math.sin(t * .7) * .03, sh.p[2] + dir.z * push);
  cam.lookAt(sh.l[0], sh.l[1], sh.l[2]);
  for (const id in cast) cast[id].update(t, f, { id, m: (f.m || {})[id] || 0, mood: (f.mood || {})[id] || 'idle' });
  document.getElementById('sub').innerHTML = f.sub ? (f.name ? `<b>${f.name}</b>` : '') + f.sub : '';
  R.render(S, cam);
};
window.renderFrame({ t: .4, st: 0, shot: 'wide' });
document.fonts.ready.then(() => { document.title = 'ready' });
</script></body></html>
