<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"></head>
<body>

<!-- 1. Хук: «Что если лень никогда не была проблемой?» -->
<section class="scene" data-s="0" data-e="3.3" data-bg="red">
  <img class="cut face" src="a/img/thinking_face_photo.png" data-in="0" data-from="fade" data-zoom="1,1.1">
  <div class="cap cloud" data-w="0.94 1.32 1.62 1.86" data-cy="660" data-rx="400" data-ry="420">никогда не была проблемой</div>
  <div class="cap big" data-w="0 0.32 0.62">Что если | *лень*</div>
</section>

<!-- 2. Второй хук: лицо пополам на «страх» -->
<section class="scene" data-s="3.3" data-e="6.2" data-tr="flash" data-hit="1.12">
  <div class="split" data-in="1.12"><img src="a/img/thinking_face_photo.png"><img src="a/img/thinking_face.png"></div>
  <div class="cap" data-w="0.06 1.12 1.4" style="top:1260px">Проблема | *страх* _ошибиться_</div>
</section>

<!-- 3. «Годами нам говорили, что медлить — это слабость» -->
<section class="scene" data-s="6.2" data-e="10.5" data-hit="2.98">
  <img class="cut face" src="a/img/thinking_face_photo.png" data-zoom="1,1.06">
  <div class="cap small" data-w="0.08" style="top:240px">Годами</div>
  <div class="count" data-from="2009" data-to="2026" data-in="0.1" data-dur="1.8" style="top:1020px"></div>
  <img class="cut" src="a/img/hourglass_not_done.png" data-in="1.98" data-from="tl" style="width:300px;left:10px;top:1180px" data-float="10">
  <svg class="marks" data-in="2.1" data-step="0.15">
    <path d="M380 520 Q540 470 700 520"/>
    <path d="M360 650 L420 770"/>
    <path d="M720 650 L660 770"/>
    <path d="M430 900 Q540 945 650 900"/>
  </svg>
  <div class="cap" data-w="1.98 2.98" style="top:1240px;left:300px">Медлить | *слабость*</div>
</section>

<!-- 4. «И каждый раз, когда ты боялся начать» — инверт и глитч -->
<section class="scene" data-s="10.5" data-e="13.7" data-tr="invert" data-glitch="1.8-2.6">
  <div class="flip" data-t="0 0.3 0.58 0.9 1.3">
    <img src="a/img/thinking_face.png"><img src="a/img/alarm_clock.png"><img src="a/img/thinking_face_photo.png"><img src="a/img/hourglass_not_done.png"><img src="a/img/thinking_face.png">
  </div>
  <div class="crosses red" data-in="1.86" data-n="7"></div>
  <div class="cap big" data-w="1.86 2.42" style="top:1160px">Боялся | *начать*</div>
</section>

<!-- 5. «кто-то продавал тебе новый курс» -->
<section class="scene" data-s="13.7" data-e="16.4">
  <img class="cut glow" src="a/img/money_bag.png" data-in="0.3" data-from="slam" style="width:380px;left:350px;top:560px" data-float="8">
  <div class="orbit" data-in="0.5" data-step="0.09" data-r="360" data-ry="1.05" data-spin="14" data-sfx="coin" style="top:820px">
    <img class="cut" src="a/img/alarm_clock.png" style="width:130px"><img class="cut" src="a/img/hourglass_not_done.png" style="width:110px">
    <img class="cut" src="a/img/money_bag.png" style="width:120px"><img class="cut" src="a/img/red_heart.png" style="width:130px">
    <img class="cut" src="a/img/alarm_clock.png" style="width:120px"><img class="cut" src="a/img/money_bag.png" style="width:110px">
  </div>
  <div class="cap" data-w="0.42 0.96 1.2 1.52" style="top:1300px">Продавал тебе | *новый курс*</div>
  <svg class="chalk" data-shape="ellipse-arrow" data-in="1.6" style="left:150px;top:1385px;width:780px;height:130px"></svg>
</section>

<!-- 6. «Планеры, марафоны, мотивация» -->
<section class="scene" data-s="16.4" data-e="19.9" data-bg="deep">
  <img class="cut" src="a/img/alarm_clock.png" data-in="0.12" data-from="left" data-out="0.95" style="width:520px;left:280px;top:520px">
  <div class="cap big" data-w="0.16" data-out="0.95" style="top:1180px">Планеры</div>
  <img class="cut" src="a/img/hourglass_not_done.png" data-in="1.06" data-from="right" data-out="1.95" style="width:420px;left:330px;top:500px">
  <div class="cap big" data-w="1.12" data-out="1.95" style="top:1180px">Марафоны</div>
  <img class="cut" src="a/img/thinking_face.png" data-in="2.0" data-from="slam" style="width:460px;left:310px;top:480px">
  <div class="scatter" data-in="2.15" data-dur="1.3" style="top:1150px">Мотивация</div>
  <div class="tag" style="left:70px;top:300px">2026</div><div class="tag" style="right:70px;top:300px">курсы</div>
</section>

<!-- 7. «Но ни одна тетрадь не начнёт за тебя» — лента и провал в тоннель -->
<section class="scene" data-s="19.9" data-e="23.0" data-end="tunnel">
  <img class="cut face" src="a/img/thinking_face_photo.png" style="top:300px">
  <div class="ribbon" data-in="0.1" data-dur="0.55" style="top:520px">
    <img class="cut" src="a/img/thinking_face.png" style="width:300px;left:430px;top:90px">
  </div>
  <div class="clock" data-in="1.4" data-from="scale" data-speed="3" style="left:60px;top:1450px"></div>
  <div class="clock" data-in="1.6" data-from="scale" data-speed="-2" style="left:800px;top:1560px;width:160px;height:160px"></div>
  <div class="cap" data-w="0.4 0.56 0.84 1.4 1.5 1.9 2.14" style="top:1150px">Ни одна тетрадь | *не начнёт* за тебя</div>
</section>

<!-- 8. «Страх не исчезнет» -->
<section class="scene" data-s="23.0" data-e="25.1" data-tr="fade" data-bg="deep" data-hit="0.2">
  <img class="cut glow" src="a/img/red_heart.png" data-in="0.1" data-from="scale" data-pulse="72" style="width:600px;left:240px;top:560px">
  <div class="cap big" data-w="0.2 0.6 0.8" style="top:1220px">Страх | *не исчезнет*</div>
</section>

<!-- 9. «Просто начни раньше, чем он проснётся» — луч и финал -->
<section class="scene" data-s="25.1" data-e="29.2" data-bg="black" data-end="black">
  <div class="beam" data-in="0.6" data-from="grow" style="top:420px;height:900px;width:760px;left:160px"></div>
  <img class="cut" src="a/img/alarm_clock.png" data-in="0.1" data-from="top" data-dist="700" style="width:300px;left:390px;top:250px">
  <div class="cap big" data-w="0.18 0.66" style="top:900px">Просто | *начни*</div>
  <div class="cap small" data-w="1.12 1.88 2.08 2.3" style="top:1330px">раньше, чем он проснётся</div>
</section>

<script src="engine.js"></script>
</body></html>
