<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Субтитры</title>
<style>
@font-face { font-family: Mont; src: url(a/Montserrat-700.ttf); font-weight: 700; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; background: transparent; overflow: hidden; }
/* СТИЛЬ СУБТИТРОВ — менять здесь */
:root { --top: 1320px; --size: 60px; --color: #fff; --key-bg: #FFE45C; --key-color: #1a1406; }
#sub { position: absolute; left: 60px; right: 60px; top: var(--top); text-align: center; font: 700 var(--size)/1.25 Mont, sans-serif; }
.w { display: inline-block; color: var(--color); margin: 0 7px; text-shadow: 0 3px 10px rgba(0,0,0,.45), 0 0 2px rgba(0,0,0,.5); }
.w.key { color: var(--key-color); background: var(--key-bg); padding: 2px 18px 8px; border-radius: 14px; text-shadow: none; box-shadow: 0 6px 18px rgba(0,0,0,.25); }
</style></head><body>
<div id="sub"></div>
<script>
// SUBS подставляет render_subs.mjs из work/subs.json
const back = x => { x = Math.min(Math.max(x, 0), 1); const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
let last = -1;
window.render = t => {
  const el = document.getElementById('sub');
  const k = SUBS.findIndex(s => t >= s.words[0][1] && t < s.end);
  if (k !== last) {
    el.innerHTML = k < 0 ? '' : SUBS[k].words.map(([w], i) => `<span class="w${i === SUBS[k].key ? ' key' : ''}">${w}</span>`).join('');
    last = k;
  }
  if (k < 0) return;
  [...el.children].forEach((sp, i) => {
    const p = (t - SUBS[k].words[i][1]) / 0.18;
    sp.style.opacity = Math.min(1, Math.max(0, p * 3));
    sp.style.transform = `scale(${(0.6 + 0.4 * back(p)).toFixed(3)}) translateY(${((1 - Math.min(1, Math.max(0, p))) * 12).toFixed(1)}px)`;
  });
};
</script></body></html>
